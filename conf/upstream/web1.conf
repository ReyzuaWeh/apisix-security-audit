worker_processes 1;
error_log stderr notice;
events {
    worker_connections 1024;
}

http {
    variables_hash_max_size 1024;
    access_log off;
    real_ip_header X-Real-IP;
    charset utf-8;
    # make sure not redirect to localhost/ without port
    absolute_redirect off; 
    port_in_redirect on;

    server {
        listen 80;

        location / {
            return 200 "hello web1";
        }
        location /large/ {
            root /usr/share/nginx/html/;
            index index.html;
        }


        location /static/ {
            alias static/;
        }
    }
}
